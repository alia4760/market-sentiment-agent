name: Daily run

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC = 9:00am ET (summer) / 8:00am ET (winter), pre-market and before the 9:30 open
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run main.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
