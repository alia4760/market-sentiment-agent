name: Daily run

on:
  schedule:
    - cron: "47 13 * * *"   # 13:47 UTC = 8:47am ET in winter. In summer time (from March) this becomes 9:47am ET, after the open: change to 47 12. Off the hour because GitHub delays or drops runs at :00
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run main.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
